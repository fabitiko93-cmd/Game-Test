name: Build Godot and deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - '.github/workflows/godot-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: godot-pages-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Godot 4.5.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.5.1-stable_linux.x86_64.zip
          sudo mv Godot_v4.5.1-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/4.5.1.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
          unzip -q Godot_v4.5.1-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.5.1.stable/
      - name: Import and smoke-test project
        run: |
          cd godot
          godot --headless --editor --quit-after 2
          godot --headless --quit-after 2
      - name: Export Web
        run: |
          rm -rf docs
          mkdir docs
          cd godot
          godot --headless --export-release Web ../docs/index.html
      - name: Publish generated web build
        run: |
          touch docs/.nojekyll
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f docs
          git commit -m 'Build Godot web export' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
