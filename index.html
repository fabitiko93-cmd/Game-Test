<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#100d16">
<title>Realmfall</title>
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="brand">REALMFALL <span>RUINS OF ASH</span></div>
  <div class="bars">
    <div class="bar hp"><i id="hpBar"></i><b id="hpText">100 / 100</b></div>
    <div class="bar xp"><i id="xpBar"></i><b id="xpText">LV 1</b></div>
  </div>
  <div class="topright"><b id="wave">WAVE 1</b><span id="kills">0 KILLS</span><span id="gold">0 GOLD</span></div>
  <div id="message"></div>
</div>
<div id="stick"><div id="knob"></div></div>
<div id="buttons">
  <button id="skill"><span>✦</span><small>ARC</small></button>
  <button id="dash"><span>➤</span><small>DASH</small></button>
  <button id="attack"><span>⚔</span><small>ATTACK</small></button>
</div>
<div id="rotate"><div><strong>iPhone drehen</strong><span>Realmfall wird im Querformat gespielt.</span></div></div>
<div id="dead" class="hidden"><div><small>THE RUINS CLAIMED YOU</small><h1>GEFALLEN</h1><p id="score"></p><button id="restart">NOCHMAL</button></div></div>
<script src="game.js?v=2"></script>
</body>
</html>
