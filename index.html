<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b1016">
  <title>Blacksite Mobile</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="gameShell">
    <canvas id="game" width="1280" height="720" aria-label="Blacksite Mobile"></canvas>

    <div id="hud">
      <div class="hudBox"><span>HP</span><b id="hp">100</b></div>
      <div class="hudBox"><span>Waffe</span><b id="weapon">Pistol</b></div>
      <div class="hudBox"><span>Ammo</span><b id="ammo">12 / 48</b></div>
      <div class="hudBox"><span>Intel</span><b id="intel">0 / 3</b></div>
      <div class="hudBox"><span>Kills</span><b id="kills">0</b></div>
    </div>

    <div id="status">STEALTH</div>
    <div id="objective">3 Intel sichern</div>

    <div id="leftStick" class="stickArea" aria-label="Bewegen"><div class="stickKnob"></div></div>
    <div id="rightStick" class="stickArea" aria-label="Zielen und schießen"><div class="stickKnob"></div></div>

    <div id="buttons">
      <button id="reloadBtn" type="button">R</button>
      <button id="swapBtn" type="button">SWAP</button>
      <button id="medBtn" type="button">MED ×2</button>
    </div>

    <div id="overlay" class="show">
      <div class="panel">
        <h1>BLACKSITE</h1>
        <p>Beschaffe 3 Intel-Pakete und erreiche die Extraktionszone. Linker Stick bewegt, rechter Stick zielt und feuert.</p>
        <button id="startBtn" type="button">MISSION STARTEN</button>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
